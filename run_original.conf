# Konfigurasi DOSBox-X untuk menjalankan GAME ASLI Creative Contraptions.
# Dipakai oleh run_original.bat. Perintah mount ADA DI .bat (pakai %~dp0) supaya
# file ini tidak menyimpan path absolut -- aman kalau folder proyek dipindah/di-rename.

[sdl]
autolock=false
output=surface

[dosbox]
machine=cga

[cpu]
cputype=8086
cycles=fixed 3000

[render]
# Skala 5x (320x200 -> 1600x1000), lalu aspect=true mengoreksi ke proporsi 4:3 (seperti CRT).
# Kalau layar kebesaran, ganti ke normal4x atau normal3x.
aspect=true
scaler=normal5x
